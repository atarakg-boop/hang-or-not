<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>לתלות כביסה?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink: #26313a; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fb2c2; font-family: 'Heebo', sans-serif; }
  canvas { display: block; }
  #hud { position: fixed; top: 4vh; right: 4vw; color: var(--ink); pointer-events: none; max-width: 62vw; transition: color 1.5s; }
  #place { font-size: clamp(14px, 1.4vw, 22px); font-weight: 300; }
  #verdict { font-size: clamp(20px, 2.2vw, 36px); font-weight: 500; line-height: 1.1; margin: .2em 0; }
  #compare { font-size: clamp(14px, 1.4vw, 22px); font-weight: 300; }
  #ctrl { position: fixed; left: 50%; bottom: 3vh; transform: translateX(-50%); width: min(880px, 86vw);
          display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: center;
          padding: 14px 20px; border-radius: 14px; background: rgba(255,255,255,.55); backdrop-filter: blur(6px);
          color: #26313a; font-size: 14px; transition: opacity .8s; }
  #ctrl.hidden { opacity: 0; pointer-events: none; }
  #ctrl input[type=range] { width: 100%; accent-color: #26313a; }
  #row-top { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; }
  #mode { padding: 2px 10px; border-radius: 99px; background: #26313a; color: #fff; font-size: 12px; }
  #mode.avg { background: transparent; color: #26313a; border: 1px solid #26313a; }
  #when { font-weight: 500; }
  #nowBtn { margin-inline-start: auto; font: inherit; padding: 4px 14px; border-radius: 8px; border: 1px solid #26313a; background: transparent; cursor: pointer; }
  #status { position: fixed; top: 1.5vh; left: 2vw; color: var(--ink); opacity: .45; font-size: 11px; font-family: monospace; direction: ltr; pointer-events: none; }
  #enter { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(30,40,50,.35); color: #fff; font-size: clamp(20px, 2.4vw, 36px); font-weight: 300; cursor: pointer; z-index: 5; }
  body.idle { cursor: none; }
</style>
<script type="importmap">
  { "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
</head>
<body>
<div id="hud">
  <div id="place"></div>
  <div id="verdict">טוען את הרוח…</div>
  <div id="compare"></div>
</div>
<div id="ctrl">
  <div id="row-top"><span id="mode">חי</span><span id="when"></span><button id="nowBtn">חזרה לעכשיו</button></div>
  <span>יום</span><input type="range" id="day" min="-182" max="182" step="1" value="0">
  <span>שעה</span><input type="range" id="hour" min="0" max="23" step="1" value="12">
</div>
<div id="status"></div>
<div id="enter">לחיצה כדי להיכנס ולשמוע את הרוח</div>

<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';

// ================= הגדרות =================
const params = new URLSearchParams(location.search);
const PLACE = params.get('place') || 'גג בתל אביב';
const LAT = +(params.get('lat') || 32.08);
const LON = +(params.get('lon') || 34.78);
const TZ = params.get('tz') || 'Asia/Jerusalem';
const DEMO = params.has('demo');
let WIND_OVERRIDE = params.get('wind');
const TEST_WINDS = [null, '15', '30', '50'];
const DRY_MM = 0.8;          // כמה מ"מ אידוי צריך סדין כדי להתייבש. לכייל לפי ניסיון.
const RAIN_PROB = 50;        // מעל זה: "לא כדאי לתלות"
const IDLE_RETURN_MS = 120000;  // אחרי 2 דקות בלי מגע חוזרים לעכשיו
const MONTHS = ['בינואר','בפברואר','במרץ','באפריל','במאי','ביוני','ביולי','באוגוסט','בספטמבר','באוקטובר','בנובמבר','בדצמבר'];
const MONTH_NAMES = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const WEEKDAYS = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const $ = id => document.getElementById(id);

// ================= זמן ושמש =================
function tzOffsetMin(utcMs) {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: TZ, hourCycle: 'h23',
    year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
    .formatToParts(new Date(utcMs)).map(x => [x.type, x.value]));
  return (Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute) - utcMs) / 60000;
}
function localToUTC(y, m, d, h, min = 0) {
  const guess = Date.UTC(y, m - 1, d, h, min);
  return guess - tzOffsetMin(guess) * 60000;
}
function localNow() {
  const ms = Date.now(), d = new Date(ms + tzOffsetMin(ms) * 60000);
  return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), h: d.getUTCHours(), min: d.getUTCMinutes() };
}
function addDays(y, m, d, k) {
  const t = new Date(Date.UTC(y, m - 1, d) + k * 864e5);
  return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate(), wd: t.getUTCDay() };
}
const doyIndex = (m, d) => Math.round((Date.UTC(2000, m - 1, d) - Date.UTC(2000, 0, 1)) / 864e5); // 0..365
const pad = n => String(n).padStart(2, '0');

function sunPos(ms) {   // גובה ואזימוט של השמש, במעלות
  const rad = Math.PI / 180, n = ms / 864e5 + 2440587.5 - 2451545.0;
  const L = (280.460 + 0.9856474 * n) % 360, g = ((357.528 + 0.9856003 * n) % 360) * rad;
  const lam = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad, eps = (23.439 - 4e-7 * n) * rad;
  const ra = Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam)), dec = Math.asin(Math.sin(eps) * Math.sin(lam));
  const gmst = ((18.697374558 + 24.06570982441908 * n) % 24 + 24) % 24, ha = (gmst * 15 + LON) * rad - ra, la = LAT * rad;
  const el = Math.asin(Math.sin(la) * Math.sin(dec) + Math.cos(la) * Math.cos(dec) * Math.cos(ha));
  const az = Math.atan2(-Math.sin(ha), Math.tan(dec) * Math.cos(la) - Math.sin(la) * Math.cos(ha));
  return { el: el / rad, az: (az / rad + 360) % 360 };
}
// המצלמה מביטה דרומה: דרום = -z, צפון = +z, מזרח = -x, מערב = +x
function sunVector(el, az) {
  const r = Math.PI / 180, c = Math.cos(el * r);
  return new THREE.Vector3(-Math.sin(az * r) * c, Math.sin(el * r), Math.cos(az * r) * c);
}

// ================= נתונים =================
const data = { live: null, avg: null, liveSource: '', avgSource: '' };

async function fetchJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error(url + ' ' + r.status); return r.json(); }

async function loadLive() {
  const d = await fetchJSON(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
    `&current=wind_speed_10m,wind_direction_10m,wind_gusts_10m,cloud_cover,precipitation` +
    `&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m,cloud_cover,precipitation_probability,et0_fao_evapotranspiration` +
    `&past_days=1&forecast_days=3&timezone=${encodeURIComponent(TZ)}`);
  data.live = { current: d.current, hourly: d.hourly };
  data.liveSource = 'חי · Open-Meteo';
}

// ממוצע לכל יום בשנה ולכל שעה, מ-10 השנים האחרונות
function emptyAvg() { const N = 366 * 24; return { wind: new Float32Array(N), gust: new Float32Array(N), dx: new Float32Array(N), dy: new Float32Array(N), et0: new Float32Array(N), cloud: new Float32Array(N), rain: new Float32Array(N), n: new Float32Array(N) }; }

async function computeAverages() {
  const y1 = new Date().getFullYear() - 1, years = Array.from({ length: 10 }, (_, i) => y1 - 9 + i);
  const parts = await Promise.all(years.map(y => fetchJSON(
    `https://archive-api.open-meteo.com/v1/archive?latitude=${LAT}&longitude=${LON}&start_date=${y}-01-01&end_date=${y}-12-31` +
    `&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m,cloud_cover,precipitation,et0_fao_evapotranspiration&timezone=${encodeURIComponent(TZ)}`)));
  const S = emptyAvg();
  for (const p of parts) {
    const H = p.hourly;
    H.time.forEach((t, i) => {
      const m = +t.slice(5, 7), d = +t.slice(8, 10), h = +t.slice(11, 13);
      if (H.wind_speed_10m[i] == null) return;
      for (let s = -3; s <= 3; s++) {     // החלקה של שבוע סביב כל תאריך
        const k = ((doyIndex(m, d) + s + 366) % 366) * 24 + h, dir = H.wind_direction_10m[i] * Math.PI / 180;
        S.wind[k] += H.wind_speed_10m[i]; S.gust[k] += H.wind_gusts_10m[i] ?? H.wind_speed_10m[i];
        S.dx[k] += Math.sin(dir); S.dy[k] += Math.cos(dir);
        S.et0[k] += H.et0_fao_evapotranspiration[i] ?? 0; S.cloud[k] += H.cloud_cover[i] ?? 0;
        S.rain[k] += (H.precipitation[i] ?? 0) > 0.1 ? 1 : 0; S.n[k]++;
      }
    });
  }
  const r1 = v => Math.round(v * 10) / 10, r3 = v => Math.round(v * 1000) / 1000;
  const out = { years: `${years[0]}–${y1}`, lat: LAT, lon: LON, wind: [], gust: [], dir: [], et0: [], cloud: [], rain: [] };
  for (let k = 0; k < 366 * 24; k++) {
    const n = S.n[k] || 1;
    out.wind.push(r1(S.wind[k] / n)); out.gust.push(r1(S.gust[k] / n));
    out.dir.push(Math.round((Math.atan2(S.dx[k], S.dy[k]) * 180 / Math.PI + 360) % 360));
    out.et0.push(r3(S.et0[k] / n)); out.cloud.push(Math.round(S.cloud[k] / n)); out.rain.push(Math.round(S.rain[k] / n * 100));
  }
  return out;
}

function demoAverages() {   // נתונים מומצאים, רק למצב ?demo
  const out = { years: 'דוגמה', wind: [], gust: [], dir: [], et0: [], cloud: [], rain: [] };
  for (let i = 0; i < 366; i++) for (let h = 0; h < 24; h++) {
    const summer = Math.cos((i - 196) / 366 * 2 * Math.PI) * .5 + .5, day = Math.max(0, Math.sin((h - 6) / 12 * Math.PI));
    out.wind.push(9 + 7 * day + 3 * (1 - summer)); out.gust.push(16 + 10 * day);
    out.dir.push(summer > .5 ? 290 : 240); out.et0.push(+(day * (0.12 + 0.35 * summer)).toFixed(3));
    out.cloud.push(Math.round(55 * (1 - summer))); out.rain.push(Math.round(14 * (1 - summer) ** 2));
  }
  return out;
}

async function loadAverages() {
  if (DEMO) { data.avg = demoAverages(); data.avgSource = 'ממוצע: דוגמה'; return; }
  try { data.avg = await fetchJSON('averages.json'); data.avgSource = 'ממוצע: קובץ'; return; } catch (e) {}
  const key = `avg-v2-${LAT}-${LON}`;
  try { const c = JSON.parse(localStorage.getItem(key)); if (c) { data.avg = c; data.avgSource = 'ממוצע: שמור'; return; } } catch (e) {}
  try {
    data.avg = await computeAverages(); data.avgSource = 'ממוצע: Open-Meteo Archive';
    try { localStorage.setItem(key, JSON.stringify(data.avg)); } catch (e) {}
  } catch (e) { console.warn('no averages', e); data.avg = demoAverages(); data.avgSource = 'ממוצע: דוגמה, אין חיבור'; }
}

async function refreshLive() {
  try { if (DEMO) throw new Error('demo'); await loadLive(); }
  catch (e) {
    try { const b = await fetchJSON('backup.json'); data.live = { current: b.current, hourly: b.hourly }; data.liveSource = 'גיבוי מוקלט'; }
    catch (e2) { console.error(e2); }
  }
}

// ================= מצב מוצג =================
const ui = { live: true, dayOffset: 0, hour: 12, lastTouch: Date.now() };

function liveIndex(dateStr, h) {
  if (!data.live) return -1;
  return data.live.hourly.time.indexOf(`${dateStr}T${pad(h)}:00`);
}

// מחזיר את מה שצריך להציג: רוח, משבים, כיוון, עננות, זמן השמש, ומקור
function resolve() {
  const now = localNow();
  if (ui.live) { ui.dayOffset = 0; ui.hour = now.h; }
  const D = addDays(now.y, now.m, now.d, ui.dayOffset), dateStr = `${D.y}-${pad(D.m)}-${pad(D.d)}`;
  const sunMs = ui.live ? Date.now() : localToUTC(D.y, D.m, D.d, ui.hour, 30);
  const out = { D, dateStr, sunMs, hour: ui.hour, kind: ui.dayOffset === 0 ? 'today' : 'avg' };

  if (out.kind === 'today' && data.live) {
    const H = data.live.hourly, i = liveIndex(dateStr, ui.hour), c = data.live.current;
    const useCur = ui.live || i < 0;
    out.wind = useCur ? c.wind_speed_10m : H.wind_speed_10m[i];
    out.gust = useCur ? c.wind_gusts_10m : H.wind_gusts_10m[i];
    out.dir = useCur ? c.wind_direction_10m : H.wind_direction_10m[i];
    out.cloud = (useCur ? c.cloud_cover : H.cloud_cover[i]) / 100;
    out.dry = (c.precipitation > 0 && useCur) ? { rain: true, hours: 0 } :
      dryingFrom(k => H.et0_fao_evapotranspiration[Math.max(0, i) + k], k => H.precipitation_probability[Math.max(0, i) + k]);
  } else if (data.avg) {
    const A = data.avg, base = doyIndex(D.m, D.d) * 24 + ui.hour, at = k => (base + k) % (366 * 24);
    out.kind = 'avg';
    out.wind = A.wind[base]; out.gust = A.gust[base]; out.dir = A.dir[base]; out.cloud = A.cloud[base] / 100;
    out.dry = dryingFrom(k => A.et0[at(k)], k => A.rain[at(k)]);
  } else { out.kind = 'none'; out.wind = 8; out.gust = 14; out.dir = 270; out.cloud = .2; out.dry = null; }

  if (data.avg) {   // הממוצע של אותו יום ושעה, לרוח הרפאים
    const k = doyIndex(D.m, D.d) * 24 + ui.hour;
    out.avgWind = data.avg.wind[k]; out.avgGust = data.avg.gust[k]; out.avgDir = data.avg.dir[k];
    out.avgDry = dryingFrom(j => data.avg.et0[(k + j) % (366 * 24)], j => data.avg.rain[(k + j) % (366 * 24)]);
  }
  if (WIND_OVERRIDE) out.wind = +WIND_OVERRIDE;
  return out;
}

function dryingFrom(et0At, probAt) {
  let sum = 0;
  for (let k = 0; k < 60; k++) {
    const p = probAt ? probAt(k) : 0, e = et0At(k);
    if (e == null) return { hours: Infinity };
    if (p >= RAIN_PROB) return { rain: true, hours: k };
    sum += e;
    if (sum >= DRY_MM) return { hours: k + 1 };
  }
  return { hours: Infinity };
}
function describe(res, startHour) {
  if (!res) return '';
  if (res.rain) return res.hours === 0 ? 'לא כדאי לתלות כביסה. יורד או צפוי גשם' : `לא כדאי לתלות כביסה. צפוי גשם בעוד ${res.hours} שעות`;
  if (!isFinite(res.hours)) return 'לא תתייבש ביומיים הקרובים';
  if (res.hours <= 6) return `תתייבש תוך כ-${res.hours} שעות`;
  const end = startHour + res.hours, word = end < 24 ? 'היום' : end < 48 ? 'מחר' : 'מחרתיים';
  return `תתייבש רק ${word} בסביבות ${pad(end % 24)}:00`;
}

function updateHud(s) {
  const dateTxt = `יום ${WEEKDAYS[s.D.wd]}, ${s.D.d} ${MONTHS[s.D.m - 1]}`;
  const timeTxt = ui.live ? (() => { const n = localNow(); return `${pad(n.h)}:${pad(n.min)}`; })() : `${pad(s.hour)}:00`;
  $('place').textContent = `${PLACE} · ${dateTxt} · ${timeTxt}`;
  const lead = s.dry && s.dry.rain ? (s.kind === 'avg' ? 'ביום ממוצע: ' : '') : (s.kind === 'avg' ? 'ביום ממוצע, הכביסה ' : 'הכביסה ');
  $('verdict').textContent = s.dry ? lead + describe(s.dry, s.hour) : 'אין נתונים ליום הזה';
  let cmp = WIND_OVERRIDE ? `רוח בדיקה ${WIND_OVERRIDE} קמ״ש (W להחלפה)` : s.kind === 'avg' ? `רוח ממוצעת ${Math.round(s.wind)} קמ״ש` : `רוח עכשיו ${Math.round(s.wind)} קמ״ש`;
  if (s.kind === 'today' && s.avgWind != null && !WIND_OVERRIDE)
    cmp += ` · ממוצע ל-${s.D.d} ${MONTHS[s.D.m - 1].slice(1)} בשעה הזו: ${Math.round(s.avgWind)} קמ״ש`;
  if (s.kind === 'avg' && data.avg) cmp += ` · ${data.avg.years}`;
  if (data.liveSource === 'גיבוי מוקלט') cmp += ' · נתוני דוגמה, לא חיים';
  $('compare').textContent = cmp;
  $('mode').textContent = ui.live ? 'חי' : s.kind === 'today' ? 'היום' : 'ממוצע 10 שנים';
  $('mode').className = s.kind === 'avg' ? 'avg' : '';
  $('when').textContent = `${s.D.d} ${MONTH_NAMES[s.D.m - 1]}, ${pad(s.hour)}:00`;
  $('day').value = ui.dayOffset; $('hour').value = ui.hour;
  $('status').textContent = `${data.liveSource} · ${data.avgSource}`;
}

// ================= סצנה =================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 3000);
const CAM = new THREE.Vector3(0, 1.5, 7.4);
camera.position.copy(CAM);

// שמיים פיזיקליים
const sky = new Sky(); sky.scale.setScalar(1000); scene.add(sky);
const envScene = new THREE.Scene(), envSky = new Sky(); envSky.scale.setScalar(1000); envScene.add(envSky);
const domeMat = new THREE.MeshBasicMaterial({ color: 0x9aa3ab, side: THREE.BackSide, transparent: true, opacity: 0, depthWrite: false, fog: false });
const dome = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), domeMat); scene.add(dome);
const envDome = new THREE.Mesh(dome.geometry, domeMat); envScene.add(envDome);
const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null;

const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -4, near: 1, far: 60 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02; sun.shadow.radius = 5;
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0x8fa6c4, 0x4a4540, 0.2); scene.add(hemi);
// מנורה על הגג, נדלקת בחושך
const lamp = new THREE.PointLight(0xffb36b, 0, 14, 1.6); lamp.position.set(-4.2, 2.5, 2.2); scene.add(lamp);
const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 8), new THREE.MeshBasicMaterial({ color: 0x333333 }));
bulb.position.copy(lamp.position); scene.add(bulb);

// ================= טקסטורות =================
function canvasTex(size, draw, repeat = 1) {
  const c = document.createElement('canvas'); c.width = c.height = size; draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); return t;
}
const concrete = canvasTex(512, (g, s) => {
  g.fillStyle = '#bdb6aa'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 9000; i++) { const v = 150 + Math.random() * 70 | 0; g.fillStyle = `rgba(${v},${v - 6},${v - 14},.25)`; g.fillRect(Math.random() * s, Math.random() * s, 2, 2); }
  g.strokeStyle = 'rgba(90,82,72,.22)'; g.lineWidth = 2;
  for (let k = 0; k <= 4; k++) { g.beginPath(); g.moveTo(k * s / 4, 0); g.lineTo(k * s / 4, s); g.stroke(); g.beginPath(); g.moveTo(0, k * s / 4); g.lineTo(s, k * s / 4); g.stroke(); }
}, 8);
concrete.colorSpace = THREE.SRGBColorSpace;
const weave = canvasTex(64, (g, s) => {   // מפת נורמלים עדינה של אריג
  const img = g.createImageData(s, s);
  for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
    const i = (y * s + x) * 4, a = Math.sin(x / s * Math.PI * 16), b = Math.sin(y / s * Math.PI * 16);
    img.data[i] = 128 + a * 40 + (Math.random() - .5) * 20; img.data[i + 1] = 128 + b * 40 + (Math.random() - .5) * 20; img.data[i + 2] = 255; img.data[i + 3] = 255;
  }

function shirtMask() {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), S = 256;
  g.fillStyle = '#000'; g.fillRect(0, 0, S, S); g.fillStyle = '#fff'; g.beginPath();
  g.moveTo(S * .30, 0); g.lineTo(S * .42, 0); g.quadraticCurveTo(S * .5, S * .08, S * .58, 0);
  g.lineTo(S * .70, 0); g.lineTo(S, S * .18); g.lineTo(S * .90, S * .38); g.lineTo(S * .76, S * .30);
  g.lineTo(S * .76, S); g.lineTo(S * .24, S); g.lineTo(S * .24, S * .30); g.lineTo(S * .10, S * .38); g.lineTo(0, S * .18);

const SHIRT = shirtMask();

// ================= גג =================
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ map: concrete, roughness: .95 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const wallMat = new THREE.MeshStandardMaterial({ color: 0xd8d1c4, roughness: .9 });
function wall(w, h, d, x, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
  m.position.set(x, h / 2, z); m.castShadow = m.receiveShadow = true; scene.add(m);
}
wall(16, 1.0, 0.25, 0, -4.8); wall(0.25, 1.0, 14, -7.2, 2); wall(0.25, 1.0, 14, 7.2, 2);

// ================= חבלים =================
const SPAN = 4.6, ROPE_Y = 2.3, SAG = 0.12;
const ropeY = x => ROPE_Y - SAG * (1 - (x / SPAN) ** 2);
const ghostLineMats = [];
function buildLine(z, ghost) {
  const mat = new THREE.MeshStandardMaterial({ color: ghost ? 0xcfd3d6 : 0x8d8a84, roughness: .6, metalness: ghost ? 0 : .4, transparent: ghost, opacity: ghost ? .35 : 1 });
  if (ghost) ghostLineMats.push(mat);
  for (const x of [-SPAN, SPAN]) {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.035, ROPE_Y + 0.1, 12), mat);
    pole.position.set(x, (ROPE_Y + 0.1) / 2, z); pole.castShadow = !ghost; scene.add(pole);
  }
  const pts = []; for (let i = 0; i <= 40; i++) { const x = -SPAN + i / 40 * SPAN * 2; pts.push(new THREE.Vector3(x, ropeY(x), z)); }
  const rope = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 80, 0.005, 6), mat);
  rope.castShadow = !ghost; scene.add(rope);
}

// ================= בד =================
const sunU = { dir: { value: new THREE.Vector3() }, col: { value: new THREE.Color() } };
class Cloth {
  constructor({ x0, w, h, z, nx, ny, shirt, ghost }) {
    this.nx = nx; this.ny = ny;
    const geo = new THREE.PlaneGeometry(w, h, nx, ny);
    let mat;
    if (ghost) {
      mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, side: THREE.DoubleSide, transparent: true, opacity: .2, depthWrite: false, alphaMap: shirt ? SHIRT : null });
    } else {
      const nm = weave.clone(); nm.needsUpdate = true; nm.repeat.set(w * 14, h * 14);
      mat = new THREE.MeshPhysicalMaterial({ color: 0xf4f2ec, roughness: .88, sheen: 1, sheenRoughness: .7, sheenColor: 0xffffff,
        side: THREE.DoubleSide, normalMap: nm, normalScale: new THREE.Vector2(.12, .12), alphaMap: shirt ? SHIRT : null, alphaTest: shirt ? .5 : 0 });
      // אור שעובר דרך הבד כשהשמש מאחוריו
      mat.onBeforeCompile = sh => {
        sh.uniforms.uSunDirV = sunU.dir; sh.uniforms.uSunCol = sunU.col;
        sh.fragmentShader = 'uniform vec3 uSunDirV;\nuniform vec3 uSunCol;\n' + sh.fragmentShader.replace('#include <lights_fragment_end>',
          `#include <lights_fragment_end>
           float tr = pow(max(0.0, dot(-normal, uSunDirV)), 1.5);
           reflectedLight.directDiffuse += diffuseColor.rgb * uSunCol * tr * 0.9;`);
      };
    }
    this.mat = mat;
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.castShadow = !ghost; this.mesh.receiveShadow = !ghost; this.mesh.frustumCulled = false;
    if (shirt && !ghost) this.mesh.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, alphaMap: SHIRT, alphaTest: .5 });
    scene.add(this.mesh);

    const n = (nx + 1) * (ny + 1);
    this.pos = new Float32Array(n * 3); this.prev = new Float32Array(n * 3); this.pinned = new Map();
    for (let r = 0; r <= ny; r++) for (let c = 0; c <= nx; c++) {
      const i = r * (nx + 1) + c, x = x0 + c / nx * w, y = ropeY(x) - r / ny * h;
      this.pos.set([x, y, z], i * 3); this.prev.set([x, y, z], i * 3);
    }
    const pinCols = shirt ? [Math.round(nx * .3), Math.round(nx * .7)] : Array.from({ length: Math.floor(nx / 4) + 1 }, (_, k) => Math.min(nx, k * 4));
    for (const c of new Set(pinCols)) {
      const x = x0 + c / nx * w; this.pinned.set(c, [x, ropeY(x) - 0.01, z]);
      if (!ghost) {
        const pin = new THREE.Mesh(new THREE.BoxGeometry(0.016, 0.07, 0.022), new THREE.MeshStandardMaterial({ color: 0xa98257, roughness: .7 }));
        pin.position.set(x, ropeY(x) - 0.02, z + 0.012); pin.castShadow = true; scene.add(pin);
      }
    }
    const cons = [], add = (a, b) => cons.push(a, b, Math.hypot(this.pos[a * 3] - this.pos[b * 3], this.pos[a * 3 + 1] - this.pos[b * 3 + 1]));
    for (let r = 0; r <= ny; r++) for (let c = 0; c <= nx; c++) {
      const i = r * (nx + 1) + c;
      if (c < nx) add(i, i + 1); if (r < ny) add(i, i + nx + 1);
      if (c < nx && r < ny) { add(i, i + nx + 2); add(i + 1, i + nx + 1); }
      if (c < nx - 1) add(i, i + 2); if (r < ny - 1) add(i, i + 2 * (nx + 1));
    }
    this.cons = new Float32Array(cons);
  }
  step(dt, wind, t) {
    const p = this.pos, q = this.prev, nrm = this.mesh.geometry.attributes.normal.array;
    const n = p.length / 3, dt2 = dt * dt, damp = 0.985, speed = Math.hypot(wind.x, wind.z);
    const wx = speed ? wind.x / speed : 0, wz = speed ? wind.z / speed : 0;
    for (let i = 0; i < n; i++) {
      const k = i * 3, x = p[k];
      const local = speed * (1 + 0.28 * Math.sin(t * 2.7 + x * 1.9) * Math.sin(t * 1.3 + p[k + 1] * 2.3));
      const f = 0.3 * Math.pow(local, 1.5) * (nrm[k] * wx + nrm[k + 2] * wz);
      const ax = nrm[k] * f + 0.25 * local * wx, ay = nrm[k + 1] * f - 9.8, az = nrm[k + 2] * f + 0.25 * local * wz;
      const vx = (p[k] - q[k]) * damp, vy = (p[k + 1] - q[k + 1]) * damp, vz = (p[k + 2] - q[k + 2]) * damp;
      q[k] = p[k]; q[k + 1] = p[k + 1]; q[k + 2] = p[k + 2];
      p[k] += vx + ax * dt2; p[k + 1] += vy + ay * dt2; p[k + 2] += vz + az * dt2;
    }
    const c = this.cons;
    for (let it = 0; it < 14; it++) {
      for (let j = 0; j < c.length; j += 3) {
        const a = c[j] * 3, b = c[j + 1] * 3, dx = p[b] - p[a], dy = p[b + 1] - p[a + 1], dz = p[b + 2] - p[a + 2];
        const d = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1e-6, s = (d - c[j + 2]) / d * 0.5;
        p[a] += dx * s; p[a + 1] += dy * s; p[a + 2] += dz * s; p[b] -= dx * s; p[b + 1] -= dy * s; p[b + 2] -= dz * s;
      }
      for (const [col, xyz] of this.pinned) p.set(xyz, col * 3);
    }
    for (let i = 0; i < n; i++) if (p[i * 3 + 1] < 0.02) p[i * 3 + 1] = 0.02;
  }
  sync() { const g = this.mesh.geometry; g.attributes.position.array.set(this.pos); g.attributes.position.needsUpdate = true; g.computeVertexNormals(); }
}

const LAYOUT = [   // רק סדינים, בגדלים שונים
  { x0: -4.3,  w: 2.1,  h: 1.6,  nx: 25, ny: 19 },
  { x0: -1.95, w: 1.6,  h: 1.3,  nx: 19, ny: 15 },
  { x0: -0.1,  w: 2.2,  h: 1.7,  nx: 26, ny: 20 },
  { x0: 2.35,  w: 1.7,  h: 1.35, nx: 20, ny: 16 },
];
buildLine(0, false);
const front = LAYOUT.map(l => new Cloth({ ...l, z: 0 }));
const ghosts = LAYOUT.map(l => new Cloth({ ...l, z: -2.6, ghost: true, nx: Math.max(6, Math.round(l.nx * .6)), ny: Math.max(4, Math.round(l.ny * .6)) }));
[...front, ...ghosts].forEach(c => c.sync());

// ================= רוח =================
function makeGusts() {
  let level = 0, target = 0, next = 0;
  return (t, dt, ratio) => {
    if (t > next) { target = Math.random() < .45 ? Math.random() * Math.max(0, ratio - 1) : 0; next = t + 2 + Math.random() * 6; }
    level += (target - level) * Math.min(1, dt * 1.5);
    return 1 + level + .12 * Math.sin(t * .9) * Math.sin(t * .37 + 1);
  };
}
const gustF = makeGusts(), gustG = makeGusts();
// הרוח נושבת אל כיוון dir+180. הכיוון האמיתי מטה את הבד לצדדים; רכיב העומק מוגבר כדי שהבד ייפתח.
function windVec(kmh, dir, factor) {
  const r = dir * Math.PI / 180, ms = kmh / 3.6 * factor;
  const zr = -Math.cos(r), xr = Math.sin(r);
  return { x: xr * ms * .25, z: Math.sign(zr || 1) * Math.max(Math.abs(zr), .55) * ms };
}

// ================= צליל =================
let audio = null;
function startAudio() {
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const buf = ac.createBuffer(1, ac.sampleRate * 3, ac.sampleRate), d = buf.getChannelData(0);
  let last = 0; for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; last = (last + .04 * w) / 1.04; d[i] = last * 3.5 + w * .15; }
  const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
  const band = ac.createBiquadFilter(); band.type = 'bandpass'; band.Q.value = .6;
  const gain = ac.createGain(); gain.gain.value = 0;
  const src2 = ac.createBufferSource(); src2.buffer = buf; src2.loop = true; src2.playbackRate.value = 1.7;
  const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1800;
  const flap = ac.createGain(); flap.gain.value = 0;
  src.connect(band).connect(gain).connect(ac.destination); src2.connect(hp).connect(flap).connect(ac.destination);
  src.start(); src2.start(); audio = { ac, band, gain, flap };
}
function updateAudio(ms) {
  if (!audio) return; const t = audio.ac.currentTime;
  audio.gain.gain.setTargetAtTime(Math.min(.9, .04 + ms * .055), t, .15);
  audio.band.frequency.setTargetAtTime(220 + ms * 55, t, .2);
  audio.flap.gain.setTargetAtTime(Math.min(.12, Math.max(0, ms - 3) * .012), t, .1);
}

// ================= ממשק =================
function touch() { ui.lastTouch = Date.now(); document.body.classList.remove('idle'); $('ctrl').classList.remove('hidden'); }
$('day').addEventListener('input', e => { ui.live = false; ui.dayOffset = +e.target.value; touch(); });
$('hour').addEventListener('input', e => { ui.live = false; ui.hour = +e.target.value; touch(); });
$('nowBtn').addEventListener('click', () => { ui.live = true; touch(); });
addEventListener('mousemove', touch);
$('enter').addEventListener('click', e => { e.currentTarget.remove(); startAudio(); document.documentElement.requestFullscreen?.().catch(() => {}); touch(); });
function download(name, obj) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(obj)], { type: 'application/json' })); a.download = name; a.click();
}
addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'f' || k === 'F') document.documentElement.requestFullscreen?.();
  if (k === 's' || k === 'S') download('backup.json', { saved_at: new Date().toISOString(), place: PLACE, ...data.live });
  if (k === 'a' || k === 'A') data.avg && download('averages.json', data.avg);
  if (k === 'n' || k === 'N') ui.live = true;
  if (k === 'w' || k === 'W') WIND_OVERRIDE = TEST_WINDS[(TEST_WINDS.indexOf(WIND_OVERRIDE) + 1) % TEST_WINDS.length];
  if (k === 'ArrowLeft') { ui.live = false; ui.dayOffset = Math.min(182, ui.dayOffset + 1); }
  if (k === 'ArrowRight') { ui.live = false; ui.dayOffset = Math.max(-182, ui.dayOffset - 1); }
  if (k === 'ArrowUp') { ui.live = false; ui.hour = (ui.hour + 1) % 24; }
  if (k === 'ArrowDown') { ui.live = false; ui.hour = (ui.hour + 23) % 24; }
  touch();
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ================= תאורה לפי שמש ועננים =================
const cur = { wind: 8, gust: 14, dir: 270, avgWind: 8, avgDir: 270, cloud: .2, sun: new THREE.Vector3(0, 1, 0), ghost: 1 };
let lastEnv = { sun: new THREE.Vector3(9, 9, 9), cloud: -1 }, envTimer = 0;
const warm = new THREE.Color(0xff9a4d), white = new THREE.Color(0xfff6ea), tmp = new THREE.Color();

function applyLighting(dt) {
  const el = Math.asin(THREE.MathUtils.clamp(cur.sun.y, -1, 1)) * 180 / Math.PI;
  const dayK = THREE.MathUtils.smoothstep(el, -4, 8), cloud = cur.cloud;
  for (const s of [sky, envSky]) {
    const u = s.material.uniforms;
    u.sunPosition.value.copy(cur.sun);
    u.turbidity.value = 2.5 + cloud * 8; u.rayleigh.value = 1.8 - cloud * 1.2;
    u.mieCoefficient.value = .005 + cloud * .02; u.mieDirectionalG.value = .8;
  }
  const domeBright = .06 + .55 * dayK;
  domeMat.color.setRGB(domeBright * .95, domeBright, domeBright * 1.05);
  domeMat.opacity = Math.min(.9, Math.pow(cloud, 1.4) * 1.05);

  sun.position.copy(cur.sun).multiplyScalar(30); sun.target.position.set(0, 0, 0);
  tmp.copy(warm).lerp(white, THREE.MathUtils.smoothstep(el, 0, 28));
  sun.color.copy(tmp); sun.intensity = 2.6 * dayK * (1 - .8 * cloud);
  sunU.col.value.copy(tmp).multiplyScalar(sun.intensity * .5);
  sunU.dir.value.copy(cur.sun).transformDirection(camera.matrixWorldInverse);
  hemi.intensity = .12 + .1 * (1 - dayK);
  const night = 1 - THREE.MathUtils.smoothstep(el, -8, 2);
  lamp.intensity = 7 * night; bulb.material.color.setRGB(.2 + night, .2 + night * .7, .2 + night * .4);
  const high = THREE.MathUtils.smoothstep(el, 5, 60);
  renderer.toneMappingExposure = .62 - .22 * high + .7 * night;
  const envI = .3 + .3 * dayK;
  [...front.map(c => c.mat), ground.material, wallMat].forEach(m => m.envMapIntensity = envI);
  document.documentElement.style.setProperty('--ink', el > 3 && cloud < .85 ? '#26313a' : '#eef2f6');

  envTimer -= dt;
  if (envTimer <= 0 && (lastEnv.sun.distanceTo(cur.sun) > .01 || Math.abs(lastEnv.cloud - cloud) > .03)) {
    envTimer = .4; lastEnv.sun.copy(cur.sun); lastEnv.cloud = cloud;
    envDome.material = domeMat;
    const rt = pmrem.fromScene(envScene, 0, .1, 2000);
    scene.environment = rt.texture; envRT?.dispose(); envRT = rt;
  }
}

// ================= לולאה =================
const clock = new THREE.Clock(); let acc = 0, hudT = 0, state = null;
const DT = 1 / 90;
function loop() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  if (!ui.live && Date.now() - ui.lastTouch > IDLE_RETURN_MS) ui.live = true;
  if (Date.now() - ui.lastTouch > 5000) { document.body.classList.add('idle'); $('ctrl').classList.add('hidden'); }

  state = resolve();
  const k = Math.min(1, dt * 1.2);   // מעבר רך בין מצבים
  cur.wind += (state.wind - cur.wind) * k; cur.gust += (state.gust - cur.gust) * k;
  cur.dir += (((state.dir - cur.dir + 540) % 360) - 180) * k;
  cur.cloud += (state.cloud - cur.cloud) * k;
  if (state.avgWind != null) { cur.avgWind += (state.avgWind - cur.avgWind) * k; cur.avgDir += (((state.avgDir - cur.avgDir + 540) % 360) - 180) * k; }
  const sp = sunPos(state.sunMs); cur.sun.lerp(sunVector(sp.el, sp.az), Math.min(1, dt * 2.5)).normalize();
  cur.ghost += ((state.kind === 'today' ? 1 : 0) - cur.ghost) * k;
  ghosts.forEach(c => { c.mesh.visible = false; });
  ghostLineMats.forEach(m => m.opacity = .35 * cur.ghost);

  const gf = gustF(t, dt, cur.wind > 0 ? cur.gust / cur.wind : 1.5), gg = gustG(t, dt, 1.5);
  const wf = windVec(cur.wind, cur.dir, gf), wg = windVec(cur.avgWind, cur.avgDir, gg);
  acc += dt;
  while (acc >= DT) { front.forEach(c => c.step(DT, wf, t));  acc -= DT; }
  [...front, ...ghosts].forEach(c => c.sync());

  camera.position.set(CAM.x + Math.sin(t * .11) * .06, CAM.y + Math.sin(t * .17) * .03, CAM.z);
  camera.lookAt(0, 1.45, 0);
  camera.updateMatrixWorld();
  applyLighting(dt);
  updateAudio(cur.wind / 3.6 * gf);
  hudT -= dt; if (hudT <= 0) { hudT = .25; updateHud(state); }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

await Promise.all([refreshLive(), loadAverages()]);
loop();
setInterval(refreshLive, 10 * 60 * 1000);
